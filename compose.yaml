version: "3.9"

services:
  web:
    image: portfolio-test:latest
    build: .
    container_name: portfolio-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 20s
      timeout: 7s
      retries: 3
      start_period: 40s